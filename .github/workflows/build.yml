name: Build Aerial TV Whitelist APK

on:
  workflow_dispatch:
    inputs:
      pkg:
        description: '包名'
        required: true
        default: 'com.ts.launcher'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          repository: pengchujin/aerial-tv

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Inject whitelist package name
        run: |
          sed -i "s/applicationId = \".*\"/applicationId = \"${{ github.event.inputs.pkg }}\"/" app/build.gradle.kts
          cat app/build.gradle.kts | grep applicationId

      - name: Build APK
        run: ./gradlew assembleStandardRelease

      - name: Verify package name
        run: |
          APK=app/build/outputs/apk/standard/release/app-standard-release.apk
          ls -lh $APK
          $ANDROID_HOME/build-tools/*/aapt dump badging $APK | head -1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aerial-tv-whitelist-apk
          path: app/build/outputs/apk/standard/release/app-standard-release.apk
