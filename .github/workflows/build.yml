name: Build Aerial TV Whitelist APK

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: '输入白名单包名（默认 com.ts.launcher）'
        required: true
        default: 'com.ts.launcher'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 下载 Aerial TV 源码
        uses: actions/checkout@v4
        with:
          repository: pengchujin/aerial-tv
          ref: v1.67

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: 安装编译工具
        run: sdkmanager "build-tools;35.0.0"

      - name: 给 gradlew 执行权限
        run: chmod +x gradlew

      - name: 修改包名为白名单包名
        run: |
          sed -i 's/^\([[:space:]]*\)applicationId = .*/\1applicationId = "${{ inputs.package_name }}"/' app/build.gradle.kts

      - name: 开始编译
        run: ./gradlew assembleStandardRelease

      - name: 检查包名是否正确
        run: |
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/standard/release/app-standard-release.apk | grep "^package"

      - name: 上传编译好的 APK
        uses: actions/upload-artifact@v4
        with:
          name: aerial-tv-whitelist-apk
          path: app/build/outputs/apk/standard/release/app-standard-release.apk
